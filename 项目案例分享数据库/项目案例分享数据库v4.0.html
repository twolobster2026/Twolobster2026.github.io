<style>
/* ================== 全局风格 ================== */
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
}
body{
    background:#f6f7f9;
    color:#333;
    padding:32px 16px;
}

/* ================== 主容器 ================== */
.container{
    max-width:1200px;
    margin:0 auto;
    background:#fff;
    border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
    overflow:hidden;
}

/* ================== 头部 ================== */
header{
    padding:36px 32px 28px;
    border-bottom:1px solid #eee;
    text-align:center;
}
header h1{
    font-size:26px;
    font-weight:700;
    margin-bottom:8px;
}
header p{
    color:#666;
    font-size:14px;
}

/* ================== 搜索区 ================== */
.search-section{
    padding:32px;
    background:#fafafa;
}
.search-title{
    font-size:18px;
    font-weight:600;
    margin-bottom:20px;
    text-align:center;
}
.search-row{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:20px;
}
label{
    font-size:13px;
    margin-bottom:6px;
    display:block;
    color:#555;
}
input,select{
    width:100%;
    padding:12px 14px;
    border-radius:8px;
    border:1px solid #ddd;
    background:#fff;
    font-size:14px;
}
input:focus,select:focus{
    outline:none;
    border-color:#3b82f6;
    box-shadow:0 0 0 3px rgba(59,130,246,.15);
}
.btn-group{
    display:flex;
    justify-content:center;
    gap:14px;
    margin-top:26px;
    flex-wrap:wrap;
}
button{
    padding:12px 28px;
    border-radius:8px;
    border:none;
    font-weight:600;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    transition:.2s;
}
.search-btn{background:#2b8fed;color:#fff;}
.search-btn:hover{background:#5aa9f0;}
.reset-btn{background:#fff;color:#2b8fed;border: 1px solid #2b8fed;}
.reset-btn:hover{
    background: #eef5ff;
    border-color: #1f6bbd;
    color: #1f6bbd;
}
.member-btn {
    background:#fff;
    color:#e67e22;
    border: 1px solid #e67e22;
}
.member-btn:hover {
    background:#fef5e8;
    border-color:#d35400;
    color:#d35400;
}
/* ================== 案例区 ================== */
.case-list{display:none;padding:32px;}
.case-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}
.back-btn{
    background:#2b8fed;
    color:#fff;
    padding:10px 18px;
    border-radius:8px;
}
.case-details{
    position: relative;
    background:#fff;
    border:1px solid #eee;
    border-radius:12px;
    padding:28px 28px 28px 36px;
    margin-bottom:26px;
}

/* 左侧竖线（案例信息总线） */
.case-details::before{
    content:'';
    position:absolute;
    left:18px;
    top:28px;
    bottom:28px;
    width:4px;
    border-radius:2px;
    background:#2563eb;
}
.case-section{
    position: relative;
    margin-bottom:26px;
    padding-left:20px;
}

/* 每个段落自己的竖线 */
.case-section::before{
    content:'';
    position:absolute;
    left:6px;
    top:6px;
    bottom:6px;
    width:2px;
    border-radius:1px;
    background:#93c5fd;
}

.section-title{
    font-size:15px;
    font-weight:600;
    margin-bottom:8px;
    display:flex;
    align-items:center;
    gap:8px;
}
.section-content{
    font-size:14px;
    line-height:1.8;
    color:#444;
}
.section-content p{
    text-indent:2em;
    margin-bottom:6px;
}
#caseName,#caseType,#caseKeywords p{ text-indent:0; }

.projectType,.keyword{
    display:inline-block;
    padding:4px 12px;
    border-radius:999px;
    font-size:12px;
    margin:4px 6px 4px 0;
    background:#eff6ff;
    color:#1e40af;
    border:1px solid #dbeafe;
}

/* ================== 操作按钮 ================== */
.case-actions{
    display:flex;
    justify-content:center;
    gap:16px;
}

.next-btn,
.prev-btn{background:#2b8fed;color:#fff;}
.export-btn{background:#fff;color:#2b8fed;border: 1px solid #2b8fed;}

.next-btn:hover,
.prev-btn:hover{background:#5aa9f0;}
.export-btn:hover{
    background: #eef5ff;
    border-color: #1f6bbd;
    color: #1f6bbd;
}

.back-btn:hover {
    background: #5aa9f0;
}

/* ================== 版本信息 ================== */
.version-info{
    text-align:center;
    padding:18px;
    font-size:13px;
    color:#666;
    border-top:1px solid #eee;
}
</style>
</head>

    // ----- 根据当前角色获取允许查看的项目列表（星级过滤）-----
    function getAllowedProjectsByRole() {
        if (currentRole === "admin") {
            return [...projects]; // 全部案例
        } else if (currentRole === "premium") {
            return projects.filter(p => p.rating === "1星" || p.rating === "2星");
        } else { // basic 仅1星
            return projects.filter(p => p.rating === "1星");
        }
    }

    // ----- 重置界面回到搜索首页（隐藏案例详情，展示搜索面板）-----
    function resetToSearchInterface() {
        searchSection.style.display = 'block';
        caseList.style.display = 'none';
        const caseVersionDiv = document.getElementById('caseVersion');
        if (caseVersionDiv) caseVersionDiv.style.display = 'none';
        showHomeVersion();
        filteredCases = [];
        currentCaseIndex = 0;
    }

    // 显示首页版本
    function showHomeVersion() { document.getElementById('homeVersion').style.display = 'block'; }
    function hideHomeVersion() { document.getElementById('homeVersion').style.display = 'none'; }

    // 更新按钮样式文字 (根据currentRole)
    function updateMemberButtonText() {
        if (currentRole === "admin") {
            memberBtn.innerHTML = '<i class="fas fa-crown"></i>管理员';
        } else if (currentRole === "premium") {
            memberBtn.innerHTML = '<i class="fas fa-gem"></i>高级会员';
        } else {
            memberBtn.innerHTML = '<i class="fas fa-id-card"></i>会员';
        }
    }

    // 存储角色到 localStorage (长期有效)
    function persistRole(role) {
        localStorage.setItem('twolobster_user_role', role);
        currentRole = role;
        updateMemberButtonText();
        // 权限变更后强制返回搜索首页，清除已有案例列表，避免越权
        resetToSearchInterface();
    }

    // 加载存储的角色
    function loadStoredRole() {
        const stored = localStorage.getItem('twolobster_user_role');
        if (stored === 'admin') {
            currentRole = 'admin';
        } else if (stored === 'premium') {
            currentRole = 'premium';
        } else {
            currentRole = 'basic';
            localStorage.setItem('twolobster_user_role', 'basic');
        }
        updateMemberButtonText();
    }

    // 会员/权限逻辑（弹窗验证）
    function handleMembership() {
        let inputCode = prompt("请输入会员码：");
        if (inputCode === null) return; // 取消无操作
        
        if (inputCode === ADMIN_CODE) {
            // 管理员
            alert("你现在可以查看所有案例");
            persistRole('admin');
        } 
        else if (inputCode === PREMIUM_CODE) {
            // 高级会员
            alert("你现在可以查看更多案例");
            persistRole('premium');
        }
        else {
            // 无效码：仅限查看1星案例
            alert("你现在可以查看案例");
            persistRole('basic');
        }
    }

    // 检索逻辑（融合权限 & 名称/类型/关键词）
    function performSearch() {
        const projectName = document.getElementById('projectName').value.toLowerCase();
        const projectType = document.getElementById('projectType').value;
        const keyword = document.getElementById('keywords').value;
        
        // 基于当前角色筛选可访问项目池
        let allowedProjects = getAllowedProjectsByRole();
        
        // 在允许范围内进行二次过滤
        let results = allowedProjects.filter(project => {
            const nameMatch = project.name.toLowerCase().includes(projectName);
            const typeMatch = projectType ? 
                (Array.isArray(project.type) ? project.type.includes(projectType) : project.type === projectType) : 
                true;
            const keywordMatch = keyword ? project.keywords.includes(keyword) : true;
            return nameMatch && typeMatch && keywordMatch;
        });
        
        if (results.length > 0) {
            filteredCases = results;
            currentCaseIndex = 0;
            displayCase(filteredCases[currentCaseIndex]);
            searchSection.style.display = 'none';
            caseList.style.display = 'block';
            hideHomeVersion();
        } else {
            alert('未找到符合权限与检索条件的案例！');
        }
    }
    
    // 显示案例详情（星级完全隐藏）
    function displayCase(project) {
        caseName.textContent = project.name;
        caseType.innerHTML = '';
        if (Array.isArray(project.type)) {
            project.type.forEach(type => {
                const span = document.createElement('span');
                span.className = 'projectType';
                span.textContent = type;
                caseType.appendChild(span);
            });
        } else {
            const span = document.createElement('span');
            span.className = 'projectType';
            span.textContent = project.type;
            caseType.appendChild(span);
        }
        
        function formatTextWithIndent(text) {
            if (!text) return '';
            const paragraphs = text.split('<br>');
            return paragraphs.map(para => {
                if (para.trim() === '') return '';
                return `<p>${para.trim()}</p>`;
            }).join('');
        }
        
        caseIntro.innerHTML = formatTextWithIndent(project.intro);
        caseAnalysis.innerHTML = formatTextWithIndent(project.analysis);
        caseRequirement.innerHTML = formatTextWithIndent(project.requirement);
        caseSuggestion.innerHTML = formatTextWithIndent(project.suggestion);
        
        const caseVersionDiv = document.getElementById('caseVersion');
        if (caseVersionDiv) {
            caseVersionDiv.style.display = 'block';
            caseVersionDiv.innerHTML = `© Twolobster ｜  Project Case Study Database | Data updated:：${project.date} | v4.0`;
        }
        
        caseKeywords.innerHTML = '';
        project.keywords.forEach(kw => {
            const span = document.createElement('span');
            span.className = 'keyword';
            span.textContent = kw;
            caseKeywords.appendChild(span);
        });
    }
    
    // ----- 事件绑定 -----
    searchBtn.addEventListener('click', performSearch);
    resetBtn.addEventListener('click', function() {
        document.getElementById('projectName').value = '';
        document.getElementById('projectType').value = '';
        document.getElementById('keywords').value = '';
    });
    backBtn.addEventListener('click', function() {
        searchSection.style.display = 'block';
        caseList.style.display = 'none';
        const caseVer = document.getElementById('caseVersion');
        if (caseVer) caseVer.style.display = 'none';
        showHomeVersion();
    });
    nextBtn.addEventListener('click', function() {
        if (filteredCases.length > 0) {
            currentCaseIndex = (currentCaseIndex + 1) % filteredCases.length;
            displayCase(filteredCases[currentCaseIndex]);
        }
    });
    prevBtn.addEventListener('click', function() {
        if (filteredCases.length > 0) {
            currentCaseIndex = (currentCaseIndex - 1 + filteredCases.length) % filteredCases.length;
            displayCase(filteredCases[currentCaseIndex]);
        }
    });
    exportBtn.addEventListener('click', function() {
        if (filteredCases.length && filteredCases[currentCaseIndex]) {
            html2canvas(document.getElementById('caseDetails')).then(canvas => {
                const link = document.createElement('a');
                link.download = '项目案例-' + filteredCases[currentCaseIndex].name + '.jpg';
                link.href = canvas.toDataURL('image/jpeg', 0.9);
                link.click();
            });
        } else {
            alert("暂无导出内容");
        }
    });
    memberBtn.addEventListener('click', handleMembership);
    
    // ---------- 初始化：加载存储角色，重置到主界面 ----------
    loadStoredRole();
    resetToSearchInterface();   // 确保显示搜索区，案例区隐藏
    // 额外确保重置按钮样式和角色一致
</script>
